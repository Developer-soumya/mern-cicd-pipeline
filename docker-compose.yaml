
services:

  # -------------------------
  # MongoDB Database
  # -------------------------
  mongodb:
    image: mongo:8.0
    container_name: devops-mongodb

    restart: unless-stopped

    ports:
      - "27017:27017"

    volumes:
      - mongo_data:/data/db

    healthcheck:
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - "db.adminCommand('ping').ok"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s


  # -------------------------
  # Node.js Backend
  # -------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: devops-backend

    restart: unless-stopped

    ports:
      - "5000:5000"

    env_file:
      - ./backend/.env

    environment:
      NODE_ENV: production
      PORT: 5000
      MONGO_URI: mongodb://mongodb:27017/devops_task_manager
      CLIENT_URL: http://localhost

    depends_on:
      mongodb:
        condition: service_healthy

    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:5000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s


  # -------------------------
  # React Frontend
  # -------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    container_name: devops-frontend

    restart: unless-stopped

    ports:
      - "80:80"

    depends_on:
      backend:
        condition: service_healthy


# -------------------------
# Persistent Database Volume
# -------------------------
volumes:
  mongo_data:
